 index.html<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tashqi dizayn faylimiz -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="user-info">
                <span id="username">Savdogar</span>
            </div>
            <h2>Trading Journal</h2>
        </header>

        <!-- Stats Card -->
        <section class="stats-card">
            <div class="stat-item">
                <p>Jami foyda</p>
                <h3 id="total-profit" class="profit-text">+0.00%</h3>
            </div>
            <div class="stat-item">
                <p>Savdolar soni</p>
                <h3 id="total-trades">0</h3>
            </div>
        </section>

        <!-- New Trade Form -->
        <section class="trade-form">
            <h3>Yangi savdo qo'shish</h3>
            <form id="journal-form">
                <div class="form-group">
                    <label for="pair">Valyuta juftligi (masalan: USDCAD)</label>
                    <input type="text" id="pair" placeholder="USDCAD" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="direction">Yo'nalish</label>
                        <select id="direction">
                            <option value="BUY">BUY</option>
                            <option value="SELL">SELL</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="result">Natija (%)</label>
                        <input type="number" step="0.01" id="result" placeholder="+2.5 yoki -1" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Saqlash</button>
            </form>
        </section>

        <!-- Trades List -->
        <section class="trades-list-section">
            <h3>So'nggi savdolar</h3>
            <div id="trades-list" class="trades-list">
                <p class="empty-msg">Hozircha savdolar mavjud emas.</p>
            </div>
        </section>
    </div>

    <!-- Logika faylimiz -->
    <script src="app.js"></script>
</body>
</html>
